<svg xmlns="http://www.w3.org/2000/svg" width="88" height="48" viewBox="0 0 88 48" role="img" aria-labelledby="title">
  <title id="title">White knight, king, and rook</title>
  <g fill="#fff" stroke="#59636e" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round">
    <!-- Knight: forward posture, shorter than the king, on the same baseline. -->
    <g transform="translate(0 15.4) scale(1 .8)">
    <path d="M5 33h20v4H5z M8 32c0-7 8-8 8-15l-5 4-6-3 5-10 5-2 1-4 4 5c8 5 7 16 2 25z"/>
    <path d="m6 14 7 1M16 11h1" fill="none" stroke="#59636e" stroke-width="2"/>
    </g>
    <!-- King: full-height cross, crown, and elongated body. -->
    <path d="M41 2h6v4h4v5h-4v5h-6v-5h-4V6h4z"/>
    <path d="M37 26 33 18q5-6 11 0 6-6 11 0l-4 8z M39 26h10l2 11H37z M36 37h16v4H36z M33 41h22v4H33z"/>
    <!-- Rook: compact tower, lowest silhouette, shared baseline. -->
    <g transform="translate(0 17.25) scale(1 .75)">
    <path d="M65 7h5v5h4V7h5v5h4V7h4v12l-4 3v10H69V22l-4-3z M67 32h18v5H67z"/>
    <path d="M69 22h14" fill="none"/>
    </g>
  </g>
</svg>
